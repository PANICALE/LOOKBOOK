<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Lookbook</title>
</head>
<body>

<div id="stage">
  <div id="book">
    <div class="page" id="pageA">
      <div class="pageInner" id="innerA"></div>
    </div>
    <div class="page" id="pageB">
      <div class="pageInner" id="innerB"></div>
    </div>
  </div>

  <div id="zoneLeft" class="zone" title="이전"><span>&#10094;</span></div>
  <div id="zoneRight" class="zone" title="다음"><span>&#10095;</span></div>

  <div id="counter">1 / 1</div>
</div>

<style>
  :root{ --bg: #111; }
  html, body{
    margin:0; padding:0; height:100%; width:100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-user-select:none; user-select:none;
  }
  #stage{
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    perspective: 2400px;
  }
  #book{
    position: relative;
    transform-style: preserve-3d;
  }
  .page{
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: #1a1a1a;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    overflow: hidden;
    backface-visibility: hidden;
    transform-style: preserve-3d;
  }
  .pageInner{
    width: 100%; height: 100%;
    display: flex;
  }
  .pageInner img{
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  /* --- 데스크톱: 스프레드(좌/우 2장) --- */
  body.mode-desktop .page{ border-radius: 4px; }
  body.mode-desktop .pageInner{ position: relative; }
  body.mode-desktop .pageInner img{ width: 50%; }
  body.mode-desktop .pageInner::after{
    content: "";
    position: absolute;
    top: 0; left: 50%;
    width: 2px; height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.35), rgba(0,0,0,0.05));
    transform: translateX(-1px);
  }
  body.mode-desktop .pageInner.single{ justify-content: center; }
  body.mode-desktop .pageInner.single img{ width: 50%; margin: 0 auto; }
  body.mode-desktop .pageInner.single::after{ display: none; }

  /* --- 모바일: 이미지 1장 풀스크린 --- */
  body.mode-mobile #book{ border-radius: 0; }
  body.mode-mobile .page{ border-radius: 0; box-shadow: none; }
  body.mode-mobile .pageInner img{ width: 100%; height: 100%; object-fit: cover; }
  body.mode-mobile .pageInner img.landscape{ object-fit: contain; }

  #pageB{ z-index: 1; }
  #pageA{ z-index: 2; }

  .flip-next{ animation: flipNext 0.6s ease-in-out forwards; transform-origin: left center; }
  .flip-prev{ animation: flipPrev 0.6s ease-in-out forwards; transform-origin: right center; }
  @keyframes flipNext{
    0%   { transform: rotateY(0deg); filter: brightness(1); }
    50%  { transform: rotateY(-90deg); filter: brightness(0.55); }
    100% { transform: rotateY(-180deg); filter: brightness(1); }
  }
  @keyframes flipPrev{
    0%   { transform: rotateY(0deg); filter: brightness(1); }
    50%  { transform: rotateY(90deg); filter: brightness(0.55); }
    100% { transform: rotateY(180deg); filter: brightness(1); }
  }

  .zone{
    position: absolute; top: 0; height: 100%; width: 20%;
    display: flex; align-items: center; cursor: pointer; z-index: 10;
    opacity: 0; transition: opacity 0.2s ease; color: #fff; font-size: 28px;
  }
  body.mode-desktop .zone:hover{ opacity: 0.55; }
  body.mode-mobile .zone{ display: none; }
  #zoneLeft{ left: 0; justify-content: flex-start; padding-left: 18px;
    background: linear-gradient(to right, rgba(0,0,0,0.35), transparent); }
  #zoneRight{ right: 0; justify-content: flex-end; padding-right: 18px;
    background: linear-gradient(to left, rgba(0,0,0,0.35), transparent); }

  #counter{
    position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,0.65); font-size: 13px; letter-spacing: 0.05em; z-index: 10;
  }
</style>

<script>
  /* ============================================================
     ★ 이미지 URL 목록 — 여기 배열만 수정하면 됩니다.
     ============================================================ */
  const BASE_URL = "https://panicale122.cafe24.com/LOOKBOOK/26FW-1/LOOKBOOK%20(";
const START_NUM = 1;
const END_NUM = 31; // 마지막 사진 번호로 수정

const IMAGE_URLS = [];
for(let i = START_NUM; i <= END_NUM; i++){
  IMAGE_URLS.push(BASE_URL + i + ").jpg");
}

  const MOBILE_BREAKPOINT = 800;
  let isMobile = window.innerWidth <= MOBILE_BREAKPOINT;
  let current = 0;
  let animating = false;

  const book = document.getElementById('book');
  const pageA = document.getElementById('pageA');
  const pageB = document.getElementById('pageB');
  const innerA = document.getElementById('innerA');
  const innerB = document.getElementById('innerB');
  const counter = document.getElementById('counter');
  const stage = document.getElementById('stage');

  function totalUnits(){
    return isMobile ? IMAGE_URLS.length : Math.ceil(IMAGE_URLS.length / 2);
  }

  function setMode(){
    isMobile = window.innerWidth <= MOBILE_BREAKPOINT;
    document.body.classList.toggle('mode-mobile', isMobile);
    document.body.classList.toggle('mode-desktop', !isMobile);
    sizeBook();
    current = Math.min(current, totalUnits() - 1);
    render();
  }

  function sizeBook(){
    if(isMobile){
      book.style.width = '100vw';
      book.style.height = '100vh';
    } else {
      const w = Math.min(window.innerWidth * 0.86, window.innerHeight * 1.3);
      const h = w / 1.3;
      book.style.width = w + 'px';
      book.style.height = h + 'px';
    }
  }

  function buildInner(container, unitIndex){
    container.innerHTML = '';
    if(isMobile){
      const img = document.createElement('img');
img.referrerPolicy = 'no-referrer';
img.src = IMAGE_URLS[unitIndex] || '';
      img.addEventListener('load', function(){
        if(img.naturalWidth > img.naturalHeight){
          img.classList.add('landscape');
        }
      });
      container.appendChild(img);
      container.classList.remove('single');
    } else {
      const leftIdx = unitIndex * 2;
      const rightIdx = unitIndex * 2 + 1;
      const hasRight = rightIdx < IMAGE_URLS.length;
      if(!hasRight){
        container.classList.add('single');
        const img = document.createElement('img');
        img.src = IMAGE_URLS[leftIdx];
        container.appendChild(img);
      } else {
        container.classList.remove('single');
        const imgL = document.createElement('img');
        imgL.src = IMAGE_URLS[leftIdx];
        const imgR = document.createElement('img');
        imgR.src = IMAGE_URLS[rightIdx];
        container.appendChild(imgL);
        container.appendChild(imgR);
      }
    }
  }

  function updateCounter(){
    counter.textContent = (current + 1) + " / " + totalUnits();
  }

  function render(){
    buildInner(innerA, current);
    updateCounter();
  }

  function goNext(){
    if(animating) return;
    if(current >= totalUnits() - 1) return;
    animating = true;

    const nextIndex = current + 1;
    buildInner(innerB, nextIndex);
    pageB.style.zIndex = 1;
    pageA.style.zIndex = 2;

    pageA.classList.remove('flip-prev');
    void pageA.offsetWidth;
    pageA.classList.add('flip-next');

    pageA.addEventListener('animationend', function handler(){
      pageA.removeEventListener('animationend', handler);
      pageA.classList.remove('flip-next');
      pageA.style.transform = '';
      current = nextIndex;
      buildInner(innerA, current);
      updateCounter();
      animating = false;
    });
  }

  function goPrev(){
    if(animating) return;
    if(current <= 0) return;
    animating = true;

    const prevIndex = current - 1;
    buildInner(innerB, prevIndex);
    pageB.style.zIndex = 1;
    pageA.style.zIndex = 2;

    pageA.classList.remove('flip-next');
    void pageA.offsetWidth;
    pageA.classList.add('flip-prev');

    pageA.addEventListener('animationend', function handler(){
      pageA.removeEventListener('animationend', handler);
      pageA.classList.remove('flip-prev');
      pageA.style.transform = '';
      current = prevIndex;
      buildInner(innerA, current);
      updateCounter();
      animating = false;
    });
  }

  document.getElementById('zoneRight').addEventListener('click', goNext);
  document.getElementById('zoneLeft').addEventListener('click', goPrev);

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') goNext();
    if(e.key === 'ArrowLeft') goPrev();
  });

  let touchStartX = null;
  stage.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
  }, {passive: true});
  stage.addEventListener('touchend', (e) => {
    if(touchStartX === null || !isMobile) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const THRESHOLD = 40;
    if(dx <= -THRESHOLD) goNext();
    else if(dx >= THRESHOLD) goPrev();
    touchStartX = null;
  }, {passive: true});

  window.addEventListener('resize', setMode);

  setMode();
</script>

</body>
</html>
